name: Verify SPAS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:rbac
      - run: pnpm test:system

  compose:
    runs-on: ubuntu-latest
    env:
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-123456
      SESSION_SECRET: ci-session-secret-1234567890
      FACE_AI_URL: https://face-ai.invalid
      FACE_AI_TOKEN: ci-face-ai-token-123456
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.local.yml config
      - run: docker compose -f docker-compose.local.yml up --build -d
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8600/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: |
          curl --fail --silent --show-error -X POST http://127.0.0.1:8600/api/auth/login -H 'content-type: application/json' --data '{"userId":"SV001","password":"sv123"}'
      - if: always()
        run: docker compose -f docker-compose.local.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.local.yml down --volumes
