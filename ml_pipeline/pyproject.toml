[project]
name = "attendance-ml-baseline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pandas>=2.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
align = [
  "insightface>=0.7",
  "onnxruntime>=1.16",
  "opencv-python-headless>=4.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
