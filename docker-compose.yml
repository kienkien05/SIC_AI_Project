services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      FACE_DEMO_DATA_DIR: /data
      FACE_DETECTOR_PATH: /models/face_best.pt
      FACE_RECOGNITION_PATH: /models/facenet_best.pt
    volumes:
      - ./models:/models:ro
      - ai_data:/data
    ports:
      - "8503:8503"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8503/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    environment:
      SPAS_DATABASE_PATH: /data/spas.db
      SPAS_SESSION_SECRET: ${SPAS_SESSION_SECRET:-local-demo-change-before-deploy}
      SPAS_AI_SERVICE_URL: http://ai:8503
    volumes:
      - portal_data:/data
    ports:
      - "8600:8600"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8600/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ai_data:
  portal_data:
